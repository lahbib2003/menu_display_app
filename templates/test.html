<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <title>Bilder rotieren mit Zentrum</title>
  <meta http-equiv="refresh" content="100">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      font-family: 'KorolevRounded';
    }
.logo {
    position: absolute;
    top: 30px;
    left: 15px;
    animation: bounceIn 2s ease;
    z-index: 2;
}

.logo img {
    height: 30px;
}
    /* Hintergrundvideo */
    #bg-video {
      position: fixed;
      top: 0;
      left: 0;
      min-width: 100%;
      min-height: 100%;
      object-fit: cover;
      z-index: -1; /* Hinter allen anderen Elementen */
    }
    header {
        text-align: center;
        font-size: 48px;
        font-family:'KorolevRounded'";
        font-weight: 700;
        margin-bottom: 30px;
        color: #f8b400;
        text-shadow: 2px 2px 5px #000;
        animation: fadeDown 1s ease-in-out;
    }
    /* Zentrierung und Wrapper */
    #wrapper {
        position: relative;
        width: 500px;
        height: 500px;
        margin: 0 auto 50px auto;
        transform: translateX(-30px)
    }

    .rotating-ring {
      position: absolute;
      width: 150%;
      height: 150%;
      animation: rotate 150s linear infinite;
    }

    .image-slide {
      position: absolute;
      width: 220px;
      height: 220px;
      border-radius: 10px;
      overflow: hidden;
      filter: blur(2px);
      opacity: 0.5;
      transition: all 1s ease;
    }

    .image-slide img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .image-slide h2,
    .image-slide p {
      transform: rotate(0deg); /* Gegenrotation, damit sie nicht mitdrehen */
    }
    .image-slide.center {
      width: 350px;
      height: 350px;
      filter: none;
      opacity: 1;
      z-index: 10;
    }
    
    #text-container {
      text-align: center;
      margin-top: 80px;
      font-family: 'Korolev Rounded';
    }
    
    #slide-name {
      color: #f8b400;
      font-family: 'KorolevRounded';
      font-size: 36px;
      margin-top: 5px;
      text-shadow: 2px 2px 5px #000;
      font-weight: 700;
    }
    
    #slide-description {
      color: #fff;
      font-family: 'KorolevRounded';
      font-size: 25px;
      margin-top: 5px;
      font-weight: 700;
    }
    
    #slide-specification {
      font-family: 'KorolevRounded';
      color: #fff;
      font-size: 20px;
      margin-bottom: 10px;
    }
    
    #slide-components {
      display: flex;
      justify-content: center;       /* Zentriert die Komponenten */
      align-items: center;           /* Zentriert sie vertikal, falls nötig */
      flex-wrap: wrap;               /* Bei Bedarf umbrechen */
      gap: 12px;
      margin-top: 15px;
      margin-bottom: 20px;
      font-family: 'KorolevRounded';
    }
    
    .component-item {
      background-color: #fff2dc;     /* Helles Beige für Lesbarkeit */
      color: #cd853f;                /* Warme Braun-Orange-Farbe */
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 20px;
      font-weight: 700;
      white-space: nowrap;
      box-shadow: 2px 2px 6px rgba(0, 0, 0, 0.1);
      transition: transform 0.2s ease;
    }
    
    .component-item:hover {
      transform: scale(1.05);        /* Kleine Hover-Animation */
    }
    
    @keyframes rotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .character-container {
        display: flex;
        float: left;
        align-items: center;
        gap: 20px;
        padding: 20px 30px;
        position: relative; /* WICHTIG: damit sich .speech-bubble daran orientiert */
    }
    .character-img {
        max-width: 500px;
        height: auto;
        border-radius: 10px;
        display: block;
        margin-left: -50px;
        position: relative;          /* ← notwendig für "top" */
        top: -50px;                  /* ← verschiebt das Bild 50px nach oben */
    }
    .character-container2 {
        display: flex;
        float: right;
        align-items: center;
        gap: 20px;
        padding: 20px 30px;
        position: relative; /* WICHTIG: damit sich .speech-bubble daran orientiert */
        top: -50px;
    }
    
    .character-img2 {
        max-width: 500px;
        height: auto;
        border-radius: 10px;
        display: block;
        margin-right: -50px; /* ← Bild mehr nach links */
    }
    @font-face {
        font-family: 'KorolevRounded';
        src: url('/static/fonts/KorolevRounded-Heavy.otf') format('opentype');
        font-weight: normal;
        font-style: normal;
    }
    
    /* Beispiel: Überschrift-Stil */
    .custom-header {
        font-family: 'KorolevRounded', sans-serif;
        font-size: 2.5em;
        font-weight: normal;
        color: #333;
    }
    
      
    .speech-bubble2 {
        position: absolute;
        top: 15%;
        right: 35%;
        transform: translate(-50%, -50%);
        background-color: white;
        border: 2px solid #000;
        padding: 12px 18px;
        border-radius: 12px;
        z-index: 10;
        font-weight: bold;
        box-shadow: 2px 2px 5px rgba(0,0,0,0.2);
        max-width: 320px;
        /* KEINE ANIMATION HIER! */

    }
    .speech-bubble {
        position: absolute;
        top: 7%;
        right: -45%;
        transform: translate(-50%, -50%);
        background-color: white;
        border: 2px solid #000;
        padding: 12px 18px;
        border-radius: 12px;
        z-index: 10;
        font-weight: bold;
        box-shadow: 2px 2px 5px rgba(0,0,0,0.2);
        max-width: 320px;
        /* KEINE ANIMATION HIER! */
    }
    .speech-bubble2::before {
        content: '';
        position: absolute;
        top: 100%;
        right: 30px;
        border-width: 10px 10px 0;
        border-style: solid;
        border-color: #fff transparent transparent transparent;
    }
    .speech-bubble::after {
        content: '';
        position: absolute;
        top: 100%;
        left: 10px;
        border-width: 10px 10px 0;
        border-style: solid;
        border-color: #fff transparent transparent transparent;
    }
    
    .typing-text span {
        white-space: nowrap;
        border-right: 2px solid black;
        display: block;
        overflow: hidden;
        max-width: 0;
        animation: typing 3s steps(80, end) forwards, blink-caret 0.75s step-end infinite;
      }
    
    /* Nur Text animieren */
    .typing-text span:nth-child(1) {
        animation-delay: 0s;
      }
      .typing-text span:nth-child(2) {
        animation-delay: 3s;
      }
      .typing-text span:nth-child(3) {
        animation-delay: 6s;
      }
      .typing-text span:nth-child(4) {
        animation-delay: 9s;
      }
      .typing-text span:nth-child(5) {
        animation-delay: 12s;
      }
    
      @keyframes typing {
        from { max-width: 0 }
        to { max-width: 60ch }
      }
      
      @keyframes blink-caret {
        0%, 100% { border-color: transparent }
        50% { border-color: black }
      }
    .ticker {
        position: fixed;
        bottom: 0;
        width: 100%;
        background: #f8b400;
        overflow: hidden;
        white-space: nowrap;
        height: 40px;
        display: flex;
        align-items: center;
        z-index: 1000;
    }
    
    .ticker-text {
        display: inline-block;
        padding-left: 100%;
        animation: scrollText 15s linear infinite;
        font-size: 18px;
        font-weight: bold;
        color: #000;
    }
    @keyframes scrollText {
        0% { transform: translateX(0%); }
        100% { transform: translateX(-100%); }
    }
    .qr-code-container {
        position: fixed;
        bottom: 50px;
        right: 30px;
        text-align: center;
        z-index: 999;
        animation: fadeInQR 1.5s ease;
    }
    
    .qr-code-container img {
        width: 100px;
        height: auto;
        opacity: 0.85;
        transition: transform 0.3s ease;
    }
    
    .qr-code-container img:hover {
        transform: scale(1.1);
        opacity: 1;
    }
    
    .qr-code-container p {
        margin: 5px 0 0;
        font-size: 14px;
        color: #fff;
        text-shadow: 1px 1px 3px #000;
    }
    #nutrition-tag {
        margin-top: 10px;
        font-weight: bold;
        font-size: 1.4em;
        color: #27ae60;
        text-align: center;
      }
      
  </style>
</head>
<body>
    <header>{{ header_text }}</header>

    
    <div class="character-container">
        <img src="{{ url_for('static', filename='ken.png') }}" alt="Character" class="character-img" />
        <div class="speech-bubble"> 
            <div class="typing-text">
                <span class="line1"> {{ ken_name }}! 👋</span>
            
              </div>
        </div>
      </div>
    
      <div class="character-container2">
        <img src="{{ url_for('static', filename='barbie.png') }}" alt="Character" class="character-img2" />
        <div class="speech-bubble2"> 
            <div class="typing-text">
                
                <span class="line1"> {{ barbie_name }}! 👋</span>
              </div>
        </div>
          
        </div>
      </div>
    
<!-- Hintergrundvideo -->
<video autoplay muted loop preload="auto" id="bg-video" poster="{{ url_for('static', filename='fallback.jpg') }}">
  {% if video %}
    <source src="{{ url_for('static', filename='uploads/' + video) }}" type="video/mp4">
  {% endif %}
  Dein Browser unterstützt kein HTML5-Video.
</video>

<!-- Bild-Wrapper -->
<!-- Wrapper für Bilder -->
<div id="wrapper">
    {% for slide in assigned_slides %}
    <div class="image-slide" 
    data-name="{{ slide.name }}" 
    data-description="{{ slide.description }}" 
    data-specification="{{ slide.specification }}"
    data-components='{{ slide.components | tojson | safe }}'
>
 <img src="{{ url_for('static', filename='uploads/' + slide.filename) }}" alt="{{ slide.name }}">
</div>
    {% endfor %}
  </div>
  
 <!-- Text wird dynamisch aktualisiert -->
 <div id="text-container">
  <p id="slide-specification"> <span></span></p>
  <h2 id="slide-name"></h2>
  <p id="slide-description"></p>
  <div id="slide-components"></div> <!-- Container für Komponenten -->
</div>
  
  
  </div>
  <div id="nutrition-tag">
    <p id="nutrition-text"></p>
  </div>
     <!-- QR-Code -->
     <div class="qr-code-container">
        <img src="{{ url_for('static', filename='qrcode.png') }}" alt="QR Code">
        <p>Für weitere Infos – jetzt scannen!</p>
    </div>
    <script>
   document.addEventListener('DOMContentLoaded', () => {
    const textSlides = document.querySelectorAll('.image-slide');
    const nameElement = document.getElementById('slide-name');
    const descriptionElement = document.getElementById('slide-description');
    const specificationElement = document.getElementById('slide-specification').querySelector('span');
    const componentsContainer = document.getElementById('slide-components');

    const formatSpecification = (spec) => {
        const specMap = {
            'vegan': 'Vegan',
            'high_protein': 'High Protein',
            'low_carbs': 'Low Carbs',
            'none': 'Keine Spezifikation',
            'Nicht angegeben': 'Nicht angegeben'
        };
        return specMap[spec] || spec;
    };

    const formatComponents = (components) => {
        if (!components || components.length === 0) {
            return '<p class="component-item">Keine Komponenten</p>';
        }
        return components
            .map((component, index) => `<p class="component-item">#Komponente ${index + 1}: ${component}</p>`)
            .join('');
    };

    // Funktion, um den Text basierend auf centerIndex zu aktualisieren
    function updateTextByIndex(index) {
        const current = textSlides[index];
        nameElement.textContent = current.dataset.name || 'Unbenannt';
        descriptionElement.textContent = current.dataset.description || 'Keine Beschreibung';
        specificationElement.textContent = formatSpecification(current.dataset.specification || 'Nicht angegeben');

        try {
            const components = JSON.parse(current.dataset.components || '[]');
            componentsContainer.innerHTML = formatComponents(components);
        } catch (e) {
            console.error("Fehler beim Parsen von components:", e);
            componentsContainer.innerHTML = '<p class="component-item">Komponenten konnten nicht geladen werden</p>';
        }
    }

    // Exporte die Funktion für Zugriff vom Rotations-Script
    window.updateTextByIndex = updateTextByIndex;

    // Initialer Text für das erste Bild
    updateTextByIndex(0);
});

      </script>
  
  <script>
const rotatingSlides = document.querySelectorAll('.image-slide');
const radius = 500;
const centerX  = 300;
const centerY = 300;
const total = rotatingSlides.length;
let rotation = 0;
let centerIndex = 0;

function updatePositions() {
    for (let i = 0; i < total; i++) {
        if (i === centerIndex) {
            rotatingSlides[i].classList.add('center');
            rotatingSlides[i].style.left = `${centerX - rotatingSlides[i].offsetWidth / 2}px`;
            rotatingSlides[i].style.top = `${centerY - rotatingSlides[i].offsetHeight / 2}px`;
            rotatingSlides[i].style.transform = 'rotate(0deg)';
        } else {
            rotatingSlides[i].classList.remove('center');
            const posIndex = i < centerIndex ? i : i - 1;
            const angle = rotation + (posIndex * (360 / (total - 1)));
            const rad = angle * Math.PI / 180;
            const x = centerX + radius * Math.cos(rad);
            const y = centerY + radius * Math.sin(rad);

            rotatingSlides[i].style.left = `${x - rotatingSlides[i].offsetWidth / 2}px`;
            rotatingSlides[i].style.top = `${y - rotatingSlides[i].offsetHeight / 2}px`;
            rotatingSlides[i].style.transform = `rotate(${angle}deg)`;
        }
    }
}

function animate() {
    rotation = (rotation + 1) % 360;
    updatePositions();
    requestAnimationFrame(animate);
}

setInterval(() => {
    centerIndex = (centerIndex + 1) % total;
    if (window.updateTextByIndex) {
        window.updateTextByIndex(centerIndex);
    }
}, 10000); // alle 10 Sekunden

animate();

  </script>
  <!-- Ticker -->
  {% if ticker_enabled %}
  <div class="ticker">
  <div class="ticker-text">🎉 Heute: High Protein Essen im Menü | 🍝 Neue Pasta-Kreationen ! | 📱 QR Code scannen Und Unsere Produkte Bestellen  !</div>
  <script>
      // Optional: Ticker-Animation per JavaScript starten
      const ticker = document.getElementById('ticker');
      ticker.style.whiteSpace = 'nowrap';
      ticker.style.overflow = 'hidden';
      ticker.style.animation = 'scroll 15s linear infinite';
  </script>
</div>
  {% endif %}
  
   <!-- Logo -->
    <div class="logo">
        <img src="{{ url_for('static', filename='logo.png') }}" alt="Logo">
    </div>
  
</body>
</html>
